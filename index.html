<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07070d">
<meta name="color-scheme" content="dark">
<meta name="description" content="Indicador holográfico animado con anillos, pistas de circuito y partículas.">
<title>Visor holográfico</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
<link rel="icon" href="iconos/icono-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Visor">

<link rel="stylesheet" href="css/estilos.css">

<!-- Mapa de importación: las escenas 3D futuras pueden hacer
     `import * as THREE from 'three'` y se cargará desde la CDN.
     No se descarga nada hasta que una escena lo importe. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header>
  <h1>Visor holográfico</h1>
  <select id="escena" aria-label="Escena"></select>
  <span id="estado">trabajando</span>
</header>

<main id="stage" aria-label="Escena interactiva">
  <!-- La escena activa inserta aquí sus propios elementos (canvas, etc.) -->
  <div id="hint">Toca para cambiar de estado · arrastra para girar · pellizca para acercar</div>
</main>

<div class="panel">
  <div class="row">
    <label for="vel">Velocidad</label>
    <input id="vel" type="range" min="0.2" max="2" step="0.05" value="0.85">
    <output id="velOut" for="vel">0.85</output>
  </div>
  <div class="row">
    <label for="den">Partículas</label>
    <input id="den" type="range" min="0" max="160" step="10" value="80">
    <output id="denOut" for="den">80</output>
  </div>
  <div class="row botones">
    <button id="toggle" class="on" type="button">Trabajando</button>
    <button id="reset" type="button">Restablecer vista</button>
    <button id="exportar" type="button" aria-haspopup="dialog">Exportar</button>
  </div>
</div>

<!-- Menú «Exportar» -->
<dialog id="menuExportar" class="hoja" aria-labelledby="menuExportarTitulo">
  <div class="hoja-cuerpo">
    <h2 id="menuExportarTitulo">Exportar «<span data-nombre></span>»</h2>
    <p class="hoja-nota" data-config></p>
    <button type="button" data-formato="html">Página independiente (.html)
      <small>Un solo archivo que muestra la escena a pantalla completa · <b></b></small></button>
    <button type="button" data-formato="js">Módulo de escena (.js)
      <small>Para usar la escena en otro proyecto · <b></b></small></button>
    <button type="button" class="secundario" data-cancelar>Cancelar</button>
  </div>
</dialog>

<!-- Último recurso si no se puede compartir ni descargar: el código para copiar -->
<dialog id="panelCodigo" class="hoja hoja-codigo" aria-labelledby="panelCodigoTitulo">
  <div class="hoja-cuerpo">
    <h2 id="panelCodigoTitulo"><span data-nombre></span></h2>
    <p class="hoja-nota">Este dispositivo no permitió guardar el archivo. Copia el código y pégalo en un archivo nuevo con este nombre.</p>
    <textarea readonly spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Código del archivo"></textarea>
    <div class="row">
      <button type="button" class="on" data-copiar autofocus>Copiar</button>
      <button type="button" data-cerrar>Cerrar</button>
    </div>
  </div>
</dialog>

<noscript><p class="noscript">Esta app necesita JavaScript.</p></noscript>
</body>
</html>
