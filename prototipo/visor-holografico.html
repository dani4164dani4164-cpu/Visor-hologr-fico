<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07070d">
<title>Visor holográfico – prototipo</title>
<style>
  :root{--bg:#07070d;--txt:#CECBF6;--dim:#7d78b8;--line:#2c2766;--acc:#7a6ff0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0}
  h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
  #estado{font:12px ui-monospace,monospace;color:var(--dim)}
  #stage{flex:1;position:relative;touch-action:none;min-height:0}
  #big{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:var(--dim);transition:opacity .6s;pointer-events:none}
  #mini{position:absolute;top:10px;right:14px;display:flex;flex-direction:column;align-items:center;gap:4px;font:10px ui-monospace,monospace;color:var(--dim);pointer-events:none}
  #small{width:48px;height:48px}
  .panel{padding:10px 16px 14px;display:grid;gap:10px;border-top:1px solid var(--line);background:#0a0a14}
  .row{display:flex;gap:10px;align-items:center}
  label{font-size:12px;color:var(--dim);width:78px;flex:none}
  input[type=range]{flex:1;accent-color:var(--acc);height:28px}
  output{font:12px ui-monospace,monospace;width:40px;text-align:right}
  button{flex:1;background:transparent;color:var(--txt);border:1px solid #534AB7;border-radius:10px;padding:11px 10px;font-size:14px;cursor:pointer}
  button:active{background:#17143a}
  button.on{background:#1d1950;border-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Visor holográfico</h1>
  <span id="estado">trabajando</span>
</header>

<div id="stage">
  <canvas id="big"></canvas>
  <div id="mini"><canvas id="small"></canvas><span>48 px</span></div>
  <div id="hint">Toca para cambiar de estado · arrastra para girar · pellizca para acercar</div>
</div>

<div class="panel">
  <div class="row">
    <label for="vel">Velocidad</label>
    <input id="vel" type="range" min="0.2" max="2" step="0.05" value="0.85">
    <output id="velOut">0.85</output>
  </div>
  <div class="row">
    <label for="den">Partículas</label>
    <input id="den" type="range" min="0" max="160" step="10" value="80">
    <output id="denOut">80</output>
  </div>
  <div class="row">
    <button id="toggle" class="on">Trabajando</button>
    <button id="reset">Restablecer vista</button>
  </div>
</div>

<script>
/* ---------- Estado global ---------- */
const S = {
  active: true, energy: 1, speed: 0.85, particles: 80,
  rot: 0, rotVel: 0, tilt: 0, zoom: 1,
  T: 0            // tiempo de simulación (avanza con velocidad y energía)
};

/* ---------- Aleatorio con semilla: el diseño no cambia al redimensionar ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- Color: azul↔morado al trabajar, gris plateado en reposo ---------- */
function col(t,a,off){
  const e=S.energy, h=242+33*Math.sin(t*0.00035+(off||0));
  return `hsla(${h},${8+77*e}%,${62+4*e}%,${Math.min(1,a*(0.55+0.45*e))})`;
}

function makeTraces(R,n,rand){
  const out=[];
  for(let i=0;i<n;i++){
    let a=rand()*6.28,r=R*(0.3+rand()*0.55);const pts=[[a,r]];
    const steps=3+Math.floor(rand()*4);
    for(let k=0;k<steps;k++){
      if(k%2){r+=R*(rand()<0.5?-1:1)*(0.05+rand()*0.1);r=Math.max(R*0.25,Math.min(R*0.9,r));}
      else a+=(rand()-.5)*0.6;
      pts.push([a,r]);
    }
    out.push({pts,ph:rand(),sp:0.5+rand()});
  }
  return out;
}

/* ---------- Un indicador dibujado en un canvas ---------- */
function Indicator(canvas,{small=false,interactive=false}={}){
  const x=canvas.getContext('2d');
  let W=0,R=0,u=1,tr=[],parts=[];
  const rand=rng(small?7:42);

  function resize(cssW,cssH){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(cssW*dpr);canvas.height=Math.round(cssH*dpr);
    W=Math.min(canvas.width,canvas.height);R=W*0.44;u=W/400;
    const r2=rng(small?7:42);
    tr=makeTraces(R,small?10:34,r2);
    syncParticles(true);
  }
  function syncParticles(rebuild){
    const n=small?16:S.particles;
    if(rebuild)parts=[];
    while(parts.length<n)parts.push({a:rand()*6.28,r:rand()*R,s:(rand()-.5)*0.02,z:rand()});
    parts.length=n;
  }
  const toXY=(a,r)=>[Math.cos(a)*r,Math.sin(a)*r];
  function path(pts){
    x.beginPath();
    pts.forEach((p,i)=>{
      if(i===0){const q=toXY(p[0],p[1]);x.moveTo(q[0],q[1]);return;}
      const pr=pts[i-1];
      if(p[1]===pr[1])x.arc(0,0,p[1],pr[0],p[0],p[0]<pr[0]);
      else{const q=toXY(p[0],p[1]);x.lineTo(q[0],q[1]);}
    });
  }

  function draw(t,dT){
    const T=S.T,e=S.energy;
    if(!small)syncParticles(false);
    x.setTransform(1,0,0,1,0,0);
    x.clearRect(0,0,canvas.width,canvas.height);
    x.globalCompositeOperation='lighter';
    x.translate(canvas.width/2,canvas.height/2);
    if(interactive){x.scale(S.zoom,S.zoom);x.rotate(S.rot);}
    x.lineWidth=Math.max(1,u);

    // Pistas de circuito, nodos y pulsos
    x.save();x.rotate(T*0.00008);
    tr.forEach((q,i)=>{
      x.strokeStyle=col(t,0.35,i*0.2);path(q.pts);x.stroke();
      [q.pts[0],q.pts[q.pts.length-1]].forEach(p=>{
        const v=toXY(p[0],p[1]);x.fillStyle=col(t,0.8,i*0.2);
        x.beginPath();x.arc(v[0],v[1],2.2*u,0,6.28);x.fill();
      });
      if(!small&&e>0.3){
        const f=((T*0.00025*q.sp)+q.ph)%1,n=q.pts.length-1,idx=Math.floor(f*n),loc=f*n-idx;
        const p0=q.pts[idx],p1=q.pts[idx+1];
        const v=toXY(p0[0]+(p1[0]-p0[0])*loc,p0[1]+(p1[1]-p0[1])*loc);
        x.fillStyle=col(t,e,i);x.beginPath();x.arc(v[0],v[1],3*u,0,6.28);x.fill();
      }
    });
    x.restore();

    // Anillos tipo giroscopio (la inclinación responde al arrastre vertical)
    for(let k=0;k<4;k++){
      const rr=R*(0.38+k*0.19);
      let tilt=0.25+0.6*Math.abs(Math.sin(T*0.0003+k));
      if(interactive)tilt=Math.max(0.06,Math.min(1,tilt+S.tilt));
      x.save();x.rotate(T*0.0004*(k%2?-1:1)+k);
      x.strokeStyle=col(t,0.55,k);
      x.beginPath();x.ellipse(0,0,rr,rr*tilt,0,0,6.28);x.stroke();
      x.setLineDash([2*u,6*u]);
      x.beginPath();x.ellipse(0,0,rr*1.04,rr*tilt*1.04,0,T*0.001,T*0.001+3.5);x.stroke();
      x.setLineDash([]);x.restore();
    }

    // Marcas del borde y arco de barrido
    x.save();x.rotate(-T*0.0002);
    for(let i=0;i<72;i++){
      const a=i/72*6.28,l=(i%6?4:10)*u;x.strokeStyle=col(t,0.6,a);
      x.beginPath();x.moveTo(Math.cos(a)*R,Math.sin(a)*R);x.lineTo(Math.cos(a)*(R-l),Math.sin(a)*(R-l));x.stroke();
    }
    const sw=T*0.002;x.strokeStyle=col(t,0.9*e,1);x.lineWidth=W/120;
    x.beginPath();x.arc(0,0,R*0.93,sw,sw+0.9);x.stroke();
    x.restore();x.lineWidth=Math.max(1,u);

    // Partículas
    const k=dT/16.7;
    parts.forEach((p,i)=>{
      p.a+=p.s*S.speed*3*k*(0.2+0.8*e);p.r+=0.15*S.speed*e*k*u*2.5;
      if(p.r>R)p.r=R*0.1;
      x.fillStyle=col(t,(0.3+0.6*p.z)*e,i*0.1);
      x.beginPath();x.arc(Math.cos(p.a)*p.r,Math.sin(p.a)*p.r*0.8,(1+p.z*2)*u,0,6.28);x.fill();
    });

    // Núcleo que pulsa
    const pulse=0.5+0.5*Math.sin(T*0.004);
    x.strokeStyle=col(t,0.6+0.4*pulse,0);x.lineWidth=W/150;
    x.beginPath();x.arc(0,0,R*(0.1+0.03*pulse*e),0,6.28);x.stroke();
    x.fillStyle=col(t,0.3+0.5*pulse*e,0);
    x.beginPath();x.arc(0,0,R*0.06,0,6.28);x.fill();
    x.globalCompositeOperation='source-over';
  }
  return {resize,draw};
}

/* ---------- Montaje ---------- */
const stage=document.getElementById('stage');
const bigC=document.getElementById('big'),smallC=document.getElementById('small');
const big=Indicator(bigC,{interactive:true}),small=Indicator(smallC,{small:true});
function layout(){const r=stage.getBoundingClientRect();big.resize(r.width,r.height);small.resize(48,48);}
new ResizeObserver(layout).observe(stage);layout();

/* ---------- Controles ---------- */
const $=id=>document.getElementById(id);
const tg=$('toggle'),estado=$('estado');
function setActive(v){
  S.active=v;tg.textContent=v?'Trabajando':'En reposo';tg.classList.toggle('on',v);
  estado.textContent=v?'trabajando':'en reposo';
}
tg.onclick=()=>setActive(!S.active);
$('reset').onclick=()=>{S.rot=0;S.rotVel=0;S.tilt=0;S.zoom=1;};
$('vel').oninput=e=>{S.speed=+e.target.value;$('velOut').textContent=S.speed.toFixed(2);};
$('den').oninput=e=>{S.particles=+e.target.value;$('denOut').textContent=S.particles;};

/* ---------- Gestos: tocar, arrastrar, pellizcar ---------- */
const ptrs=new Map();let down=null,pinch0=null,hintHidden=false;
function hideHint(){if(!hintHidden){hintHidden=true;$('hint').style.opacity=0;}}
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),z:S.zoom};if(down)down.moved=true;}
});
stage.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&pinch0){
    const [a,b]=[...ptrs.values()];
    S.zoom=Math.max(0.5,Math.min(2.5,pinch0.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d));hideHint();return;
  }
  if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)down.moved=true;
  if(down&&down.moved){S.rot+=dx*0.008;S.rotVel=dx*0.008;S.tilt=Math.max(-0.3,Math.min(0.7,S.tilt+dy*0.004));hideHint();}
});
function up(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch0=null;
  if(ptrs.size===0&&down){
    if(!down.moved&&performance.now()-down.t<300){setActive(!S.active);hideHint();}
    down=null;
  }
}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();S.zoom=Math.max(0.5,Math.min(2.5,S.zoom*Math.exp(-e.deltaY*0.001)));},{passive:false});

/* ---------- Bucle ---------- */
let last=performance.now();
function loop(t){
  const dT=Math.min(50,t-last);last=t;
  S.energy+=((S.active?1:0)-S.energy)*(1-Math.pow(0.97,dT/16.7));
  S.T+=dT*S.speed*(0.2+0.8*S.energy);
  if(!down){S.rot+=S.rotVel;S.rotVel*=Math.pow(0.94,dT/16.7);}
  big.draw(t,dT);small.draw(t,dT);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
